<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingia - FRESH SCENTS</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="icon" href="images/logo.jpeg">
<style>
 body{
   display:flex;align-items:center;justify-content:center;min-height:100vh;
   background:linear-gradient(135deg,#1a1408,#2b2118), url('images/logo.jpeg');
   background-blend-mode:overlay; background-size:cover; background-position:center;
 }
 .login-box{max-width:380px;width:92%;background:rgba(255,253,248,.97);border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
 .logo-wrap{text-align:center;margin-bottom:6px}
 .logo-wrap img{width:70px}
 .login-box h1{font-size:17px;color:var(--gold-dark);text-align:center;margin:6px 0 18px}
 .fp-link{display:block;text-align:right;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo-wrap"><img src="images/logo.jpeg" alt="logo"></div>
  <h1 id="shopTitle">FRESH SCENTS<br><span style="font-size:12.5px;color:var(--muted)">Mfumo wa Ndani wa Duka</span></h1>
  <div id="alertBox"></div>
  <form id="loginForm">
    <label>Username</label>
    <input type="text" name="username" required autofocus>
    <label>Password</label>
    <div class="password-field">
      <input type="password" name="password" required>
      <button type="button" class="password-toggle-btn" onclick="togglePasswordField(this)" tabindex="-1"><i class="bi bi-eye"></i></button>
    </div>
    <a class="fp-link" href="forgot-password.html">Umesahau password?</a>
    <button type="submit" class="btn-primary" style="width:100%;margin-top:14px">Ingia</button>
  </form>
  <p style="text-align:center;margin-top:16px;font-size:12px"><a href="index.html">&larr; Rudi Mwanzo</a></p>
</div>

<script src="js/api.js"></script>
<script>
async function checkInstall() {
  const r = await apiGet('install.php', { action: 'status' });
  if (r.success && !r.installed) {
    window.location.href = 'install.html';
  }
}
checkInstall();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const r = await apiPost('auth.php', {
    username: form.username.value.trim(),
    password: form.password.value,
  }, 'login');

  const box = document.getElementById('alertBox');
  if (!r.success) {
    box.innerHTML = `<div class="alert alert-error">${r.message}</div>`;
  } else {
    box.innerHTML = `<div class="alert alert-success">${r.message}</div>`;
    setTimeout(() => window.location.href = 'dashboard.html', 500);
  }
});
</script>
</body>
</html>
