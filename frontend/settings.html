<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mipangilio - FRESH SCENTS</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="icon" href="images/logo.jpeg">
</head>
<body>
<div class="admin-wrap" id="adminWrap"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
const fieldLabels = {
  shop_name: 'Jina la Duka',
  shop_tagline: 'Kaulimbiu ya Duka',
  shop_phone: 'Namba ya Simu ya Duka',
  shop_address: 'Anuani ya Duka',
};

async function loadPage() {
  const admin = await initAdminShell({ activePage: 'settings.html', pageTitle: 'Mipangilio ya Duka' });
  if (!admin) return;
  if (!requireRole(admin, ['super_admin'])) return;

  const r = await apiGet('settings.php', { action: 'get' });
  if (!r.success) return;

  document.getElementById('pageContent').innerHTML = `
    <div id="alertBox"></div>
    <div class="card" style="max-width:600px">
      <h3 style="margin-top:0;color:var(--gold-dark)"><i class="bi bi-gear"></i> Mipangilio ya Jumla</h3>
      <form id="settingsForm">
        ${Object.entries(fieldLabels).map(([key, label]) => `
          <label>${label}</label>
          <input type="text" id="f_${key}" value="${r.settings[key] || ''}">
        `).join('')}
        <button class="btn-primary" style="width:100%;margin-top:16px" type="submit">Hifadhi Mipangilio</button>
      </form>
    </div>
  `;

  document.getElementById('settingsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {};
    Object.keys(fieldLabels).forEach(key => { payload[key] = document.getElementById('f_' + key).value.trim(); });
    const res = await apiPost('settings.php', payload, 'save');
    document.getElementById('alertBox').innerHTML = `<div class="alert ${res.success ? 'alert-success' : 'alert-error'}">${res.message}</div>`;
  });
}

loadPage();
</script>
</body>
</html>
