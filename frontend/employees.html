<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wafanyakazi - FRESH SCENTS</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="icon" href="images/logo.jpeg">
</head>
<body>
<div class="admin-wrap" id="adminWrap"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
let allEmployees = [];

async function loadPage() {
  const admin = await initAdminShell({ activePage: 'employees.html', pageTitle: 'Wafanyakazi' });
  if (!admin) return;
  if (!requireRole(admin, ['super_admin', 'admin'])) return;
  renderShell();
  await loadEmployees();
}

function renderShell() {
  document.getElementById('pageContent').innerHTML = `
    <div id="alertBox"></div>
    <div class="page-header">
      <h2 id="empCount">Wafanyakazi</h2>
      <button class="btn-primary" onclick="openAdd()">+ Ongeza Mfanyakazi</button>
    </div>
    <div class="table-wrap">
      <table>
        <tr><th>Jina</th><th>Nafasi</th><th>Simu</th><th>Mshahara</th><th>Tarehe ya Kuajiriwa</th><th>Hali</th><th>Vitendo</th></tr>
        <tbody id="empTbody"></tbody>
      </table>
    </div>

    <div class="modal-bg hidden" id="modalBg">
      <div class="modal">
        <span class="close-x" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle">Ongeza Mfanyakazi</h3>
        <form id="empForm">
          <input type="hidden" id="f_id">
          <label>Jina Kamili</label>
          <input type="text" id="f_name" required>
          <div class="form-row">
            <div><label>Nafasi (Position)</label><input type="text" id="f_position" required placeholder="Mfano: Muuzaji"></div>
            <div><label>Namba ya Simu</label><input type="text" id="f_phone"></div>
          </div>
          <div class="form-row">
            <div><label>Mshahara (TZS)</label><input type="number" step="0.01" id="f_salary" required></div>
            <div><label>Tarehe ya Kuajiriwa</label><input type="date" id="f_hired_date"></div>
          </div>
          <label>Hali</label>
          <select id="f_status">
            <option value="active">Yupo Kazini</option>
            <option value="inactive">Hayupo</option>
          </select>
          <button type="submit" class="btn-primary" style="width:100%;margin-top:16px">Hifadhi</button>
        </form>
      </div>
    </div>
  `;
  document.getElementById('empForm').addEventListener('submit', submitEmployee);
}

async function loadEmployees() {
  const r = await apiGet('employees.php', { action: 'list' });
  if (!r.success) return;
  allEmployees = r.employees;
  document.getElementById('empCount').textContent = `Wafanyakazi (${allEmployees.length})`;
  document.getElementById('empTbody').innerHTML = allEmployees.map(e => `
    <tr>
      <td>${e.full_name}</td><td>${e.position}</td><td>${e.phone || '-'}</td><td>${money(e.salary)}</td>
      <td>${e.hired_date ? fdateOnly(e.hired_date) : '-'}</td>
      <td><span class="badge ${e.status === 'active' ? 'badge-completed' : 'badge-cancelled'}">${e.status === 'active' ? 'Yupo Kazini' : 'Hayupo'}</span></td>
      <td>
        <button class="btn-outline btn-sm" onclick="openEdit(${e.id})">Hariri</button>
        <button class="btn-danger btn-sm" onclick="deleteEmployee(${e.id})">Futa</button>
      </td>
    </tr>
  `).join('') || '<tr><td colspan="7" class="muted">Hakuna wafanyakazi bado.</td></tr>';
}

function openAdd() {
  document.getElementById('modalTitle').textContent = 'Ongeza Mfanyakazi';
  document.getElementById('f_id').value = '';
  document.getElementById('f_name').value = '';
  document.getElementById('f_position').value = '';
  document.getElementById('f_phone').value = '';
  document.getElementById('f_salary').value = '';
  document.getElementById('f_hired_date').value = '';
  document.getElementById('f_status').value = 'active';
  document.getElementById('modalBg').classList.remove('hidden');
}

function openEdit(id) {
  const e = allEmployees.find(x => x.id === id);
  if (!e) return;
  document.getElementById('modalTitle').textContent = 'Hariri Mfanyakazi';
  document.getElementById('f_id').value = e.id;
  document.getElementById('f_name').value = e.full_name;
  document.getElementById('f_position').value = e.position;
  document.getElementById('f_phone').value = e.phone || '';
  document.getElementById('f_salary').value = e.salary;
  document.getElementById('f_hired_date').value = e.hired_date || '';
  document.getElementById('f_status').value = e.status;
  document.getElementById('modalBg').classList.remove('hidden');
}

function closeModal() { document.getElementById('modalBg').classList.add('hidden'); }

async function submitEmployee(e) {
  e.preventDefault();
  const payload = {
    id: document.getElementById('f_id').value,
    full_name: document.getElementById('f_name').value.trim(),
    position: document.getElementById('f_position').value.trim(),
    phone: document.getElementById('f_phone').value.trim(),
    salary: parseFloat(document.getElementById('f_salary').value),
    hired_date: document.getElementById('f_hired_date').value,
    status: document.getElementById('f_status').value,
  };
  const r = await apiPost('employees.php', payload, 'save');
  if (!r.success) { alert(r.message); return; }
  closeModal();
  await loadEmployees();
}

async function deleteEmployee(id) {
  if (!confirm('Futa mfanyakazi huyu?')) return;
  await apiGet('employees.php', { action: 'delete', id });
  await loadEmployees();
}

loadPage();
</script>
</body>
</html>
