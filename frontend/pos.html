<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekodi Mauzo - FRESH SCENTS</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="icon" href="images/logo.jpeg">
</head>
<body>
<div class="admin-wrap" id="adminWrap"></div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
let saleItems = [];
let allVariants = [];
const paymentLabels = { cash: 'Fedha Taslimu', mobile_money: 'Mobile Money', bank: 'Benki', other: 'Nyingine' };

async function loadPage() {
  const admin = await initAdminShell({ activePage: 'pos.html', pageTitle: 'Rekodi Mauzo' });
  if (!admin) return;
  renderShell();
  await loadVariants();
  await loadRecent();
}

function renderShell() {
  document.getElementById('pageContent').innerHTML = `
    <div class="page-header"><h2>Rekodi Mauzo</h2></div>
    <p class="muted" style="margin-top:-10px;margin-bottom:20px">Tumia ukurasa huu kurekodi kila mauzo yanayofanyika dukani. Stock hupungua moja kwa moja.</p>

    <div class="grid grid-2">
      <div class="card">
        <h3 style="margin-top:0;color:var(--gold-dark)"><i class="bi bi-bag-check"></i> Chagua Bidhaa</h3>
        <label>Tafuta / Chagua Bidhaa na Ukubwa (ML)</label>
        <div id="productAcWrap"></div>
        <p class="muted" style="font-size:11.5px;margin:6px 0 0">Bonyeza kuona bidhaa zote zilizopo stock, au andika jina (mfano: "Aro") kutafuta haraka. Ukichagua, bidhaa huongezwa moja kwa moja kwenye mauzo.</p>
        <hr style="margin:18px 0;border-color:#eee2c5">
        <div id="saleItemsWrap"><p class="muted">Bado hujachagua bidhaa yoyote.</p></div>
        <p style="text-align:right;font-size:18px;font-weight:800;margin-top:10px">Jumla: <span id="saleTotal">0 TZS</span></p>
      </div>

      <div class="card">
        <h3 style="margin-top:0;color:var(--gold-dark)"><i class="bi bi-receipt"></i> Kamilisha Mauzo</h3>
        <form id="saleForm">
          <label>Jina la Mteja (hiari, kwa rekodi tu)</label>
          <input type="text" id="customerName" placeholder="Mfano: Mteja wa kawaida">
          <label>Namba ya Simu (hiari)</label>
          <input type="text" id="customerPhone" placeholder="0621002091">
          <label>Njia ya Malipo</label>
          <select id="paymentMethod">
            <option value="cash">Fedha Taslimu</option>
            <option value="mobile_money">Mobile Money</option>
            <option value="bank">Benki</option>
            <option value="other">Nyingine</option>
          </select>
          <label>Maelezo (hiari)</label>
          <textarea id="saleNotes"></textarea>
          <button type="submit" class="btn-primary btn-block" style="width:100%;margin-top:16px" id="submitSaleBtn" disabled>
            <i class="bi bi-check-circle"></i> Kamilisha na Rekodi Mauzo
          </button>
        </form>
      </div>
    </div>

    <br>
    <div id="recentSalesWrap"></div>

    <div class="modal-bg hidden" id="saleModalBg">
      <div class="modal">
        <span class="close-x" onclick="closeSaleModal()">&times;</span>
        <h3><i class="bi bi-pencil-square"></i> Hariri Taarifa za Mauzo</h3>
        <p class="muted" style="font-size:11.5px;margin-top:-6px">Bidhaa na kiasi cha mauzo haviwezi kubadilishwa hapa. Kama kuna kosa la bidhaa, futa mauzo haya na urekodi upya.</p>
        <form id="saleEditForm">
          <input type="hidden" id="editSaleId">
          <label>Jina la Mteja</label>
          <input type="text" id="editCustomerName">
          <label>Namba ya Simu</label>
          <input type="text" id="editCustomerPhone">
          <label>Njia ya Malipo</label>
          <select id="editPaymentMethod">
            <option value="cash">Fedha Taslimu (Cash)</option>
            <option value="mobile_money">Mobile Money</option>
            <option value="bank">Benki</option>
            <option value="other">Nyingine</option>
          </select>
          <label>Maelezo</label>
          <textarea id="editSaleNotes"></textarea>
          <button type="submit" class="btn-primary" style="width:100%;margin-top:16px">Hifadhi Mabadiliko</button>
        </form>
      </div>
    </div>
  `;
  document.getElementById('saleForm').addEventListener('submit', submitSale);
  document.getElementById('saleEditForm').addEventListener('submit', submitSaleEdit);
}

let productAc = null;
async function loadVariants() {
  const r = await apiGet('pos.php', { action: 'variants' });
  if (!r.success) return;
  allVariants = r.variants;
  if (!productAc) {
    productAc = createAutocomplete({
      wrapEl: document.getElementById('productAcWrap'),
      items: allVariants,
      placeholder: 'Andika jina la bidhaa (mfano: Aro)...',
      noResultsText: 'Hakuna bidhaa inayolingana au haipo stock.',
      getSearchText: v => `${v.name} ${v.brand || ''} ${v.ml}`,
      getLabel: v => `${v.name} — ${v.ml}ml`,
      getSub: v => `${money(v.price)} &middot; Stock: ${v.stock_qty}`,
      onSelect: v => addItemFromVariant(v),
    });
  } else {
    productAc.setItems(allVariants);
  }
}

async function loadRecent() {
  await applySalesFilter();
}

// Kichujio cha muda kwa "Mauzo ya Hivi Karibuni"
let salesPendingPeriod = 'daily';
let salesPendingYear = new Date().getFullYear();
let salesPendingFrom = new Date().toISOString().slice(0, 8) + '01';
let salesPendingTo = new Date().toISOString().slice(0, 10);
let lastSalesReport = null;

function selectSalesPeriod(period) {
  salesPendingPeriod = period;
  renderRecentSales();
}
function setSalesYear(v) { salesPendingYear = parseInt(v); }
function setSalesFrom(v) { salesPendingFrom = v; }
function setSalesTo(v) { salesPendingTo = v; }

async function applySalesFilter() {
  if (salesPendingPeriod === 'yearly') {
    const el = document.getElementById('salesYearSelect');
    if (el) salesPendingYear = parseInt(el.value);
  }
  if (salesPendingPeriod === 'custom') {
    const f = document.getElementById('salesFromDate');
    const t = document.getElementById('salesToDate');
    if (f) salesPendingFrom = f.value;
    if (t) salesPendingTo = t.value;
  }

  const params = { action: 'recent', period: salesPendingPeriod };
  if (salesPendingPeriod === 'yearly') params.year = salesPendingYear;
  if (salesPendingPeriod === 'custom') { params.from = salesPendingFrom; params.to = salesPendingTo; }

  const r = await apiGet('pos.php', params);
  if (!r.success) return;
  if (r.year) salesPendingYear = r.year;
  lastSalesReport = r;
  renderRecentSales();
}

function renderRecentSales() {
  const wrap = document.getElementById('recentSalesWrap');
  if (!wrap) return;

  const periodBtn = (p, label) => `<a href="#" onclick="selectSalesPeriod('${p}');return false;" class="btn-${salesPendingPeriod === p ? 'primary' : 'secondary'} btn-sm">${label}</a>`;
  const years = (lastSalesReport && lastSalesReport.available_years) || [salesPendingYear];
  const yearOptions = years.map(y => `<option value="${y}" ${y === salesPendingYear ? 'selected' : ''}>${y}</option>`).join('');

  let html = `
    <div class="page-header"><h2>Mauzo${lastSalesReport ? ' — ' + lastSalesReport.label : ''}</h2></div>
    <div class="toolbar">
      ${periodBtn('daily', 'Siku')}
      ${periodBtn('weekly', 'Wiki')}
      ${periodBtn('monthly', 'Mwezi')}
      ${periodBtn('yearly', 'Mwaka')}
      ${periodBtn('custom', 'Kipindi Maalum')}
    </div>
    ${salesPendingPeriod === 'yearly' ? `
    <div class="toolbar">
      <label style="margin:0">Chagua Mwaka</label>
      <select id="salesYearSelect" style="margin-top:0;width:auto">${yearOptions}</select>
    </div>` : ''}
    ${salesPendingPeriod === 'custom' ? `
    <div class="toolbar">
      <label style="margin:0">Kuanzia</label><input type="date" id="salesFromDate" value="${salesPendingFrom}">
      <label style="margin:0">Hadi</label><input type="date" id="salesToDate" value="${salesPendingTo}">
    </div>` : ''}
    <div class="toolbar">
      <button class="btn-primary btn-sm" style="margin-top:0" onclick="applySalesFilter()"><i class="bi bi-funnel-fill"></i> Chuja</button>
    </div>
  `;

  if (lastSalesReport) {
    const r = lastSalesReport;
    html += `
      <div class="grid grid-3">
        <div class="stat-card success"><div class="label">Jumla ya Mauzo</div><div class="value">${money(r.total_sales)}</div></div>
        <div class="stat-card"><div class="label">Idadi ya Miamala</div><div class="value">${r.total_transactions}</div></div>
        <div class="stat-card info"><div class="label">Wastani kwa Muamala</div><div class="value">${money(r.average_sale)}</div></div>
      </div>
      <br>
      <div class="table-wrap">
        <table>
          <tr><th>Namba</th><th>Mteja</th><th>Simu</th><th>Malipo</th><th>Kiasi</th><th>Aliyeuza</th><th>Tarehe</th><th>Vitendo</th></tr>
          ${r.sales.map(s => `
            <tr>
              <td><strong>${s.sale_code}</strong></td>
              <td>${s.customer_name || '-'}</td>
              <td>${s.customer_phone || '-'}</td>
              <td>${paymentLabels[s.payment_method] || s.payment_method}</td>
              <td>${money(s.total_amount)}</td>
              <td>${s.admin_name || '-'}</td>
              <td>${fdate(s.created_at)}</td>
              <td>
                <button class="btn-outline btn-sm" onclick='openSaleEdit(${JSON.stringify(s)})'>Hariri</button>
                <button class="btn-danger btn-sm" onclick="deleteSale(${s.id})">Futa</button>
              </td>
            </tr>
          `).join('') || '<tr><td colspan="8" class="muted">Hakuna mauzo yaliyorekodiwa kwenye kipindi hiki.</td></tr>'}
        </table>
      </div>
    `;
  }

  wrap.innerHTML = html;
}

function openSaleEdit(s) {
  document.getElementById('editSaleId').value = s.id;
  document.getElementById('editCustomerName').value = s.customer_name || '';
  document.getElementById('editCustomerPhone').value = s.customer_phone || '';
  document.getElementById('editPaymentMethod').value = s.payment_method;
  document.getElementById('editSaleNotes').value = s.notes || '';
  document.getElementById('saleModalBg').classList.remove('hidden');
}

function closeSaleModal() {
  document.getElementById('saleModalBg').classList.add('hidden');
}

async function submitSaleEdit(e) {
  e.preventDefault();
  const payload = {
    id: document.getElementById('editSaleId').value,
    customer_name: document.getElementById('editCustomerName').value.trim(),
    customer_phone: document.getElementById('editCustomerPhone').value.trim(),
    payment_method: document.getElementById('editPaymentMethod').value,
    notes: document.getElementById('editSaleNotes').value.trim(),
  };
  const r = await apiPost('pos.php', payload, 'update');
  if (!r.success) { alert(r.message); return; }
  closeSaleModal();
  await applySalesFilter();
}

async function deleteSale(id) {
  if (!confirm('Una uhakika unataka kufuta mauzo haya? Stock ya bidhaa husika itarudishwa.')) return;
  const r = await apiGet('pos.php', { action: 'delete', id });
  if (!r.success) { alert(r.message); return; }
  await applySalesFilter();
  await loadVariants();
}
function addItemFromVariant(v) {
  const variantId = parseInt(v.id);
  const stock = parseInt(v.stock_qty);
  const existing = saleItems.find(i => i.variant_id === variantId);
  const currentQty = existing ? existing.qty : 0;
  if (currentQty + 1 > stock) { alert('Stock haitoshi kwa bidhaa hii.'); productAc.clear(); return; }

  if (existing) existing.qty += 1;
  else saleItems.push({ variant_id: variantId, name: v.name, ml: v.ml, price: parseFloat(v.price), stock, qty: 1 });

  renderSaleItems();
  productAc.clear();
}

function changeItemQty(variantId, delta) {
  const item = saleItems.find(i => i.variant_id === variantId);
  if (!item) return;
  const newQty = item.qty + delta;
  if (newQty < 1) { removeItem(variantId); return; }
  if (newQty > item.stock) { alert('Stock haitoshi.'); return; }
  item.qty = newQty;
  renderSaleItems();
}

function removeItem(variantId) {
  saleItems = saleItems.filter(i => i.variant_id !== variantId);
  renderSaleItems();
}

function renderSaleItems() {
  const wrap = document.getElementById('saleItemsWrap');
  const submitBtn = document.getElementById('submitSaleBtn');

  if (!saleItems.length) {
    wrap.innerHTML = '<p class="muted">Bado hujachagua bidhaa yoyote.</p>';
    document.getElementById('saleTotal').textContent = '0 TZS';
    submitBtn.disabled = true;
    return;
  }

  let total = 0;
  wrap.innerHTML = saleItems.map(i => {
    const subtotal = i.price * i.qty;
    total += subtotal;
    return `
      <div style="border-bottom:1px solid var(--border);padding:10px 0;display:flex;align-items:center;gap:10px">
        <div style="flex:1">
          <div style="font-weight:700;font-size:14px">${i.name}</div>
          <div class="muted" style="font-size:12.5px">${i.ml}ml &middot; ${i.price.toLocaleString()} TZS</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <button type="button" class="btn-outline btn-sm" onclick="changeItemQty(${i.variant_id}, -1)">−</button>
          <span>${i.qty}</span>
          <button type="button" class="btn-outline btn-sm" onclick="changeItemQty(${i.variant_id}, 1)">+</button>
        </div>
        <div style="min-width:90px;text-align:right;font-weight:700">${subtotal.toLocaleString()} TZS</div>
        <span style="color:var(--danger);cursor:pointer" onclick="removeItem(${i.variant_id})"><i class="bi bi-trash3"></i></span>
      </div>`;
  }).join('');

  document.getElementById('saleTotal').textContent = total.toLocaleString() + ' TZS';
  submitBtn.disabled = false;
}

async function submitSale(e) {
  e.preventDefault();
  const payload = {
    items: saleItems.map(i => ({ variant_id: i.variant_id, qty: i.qty })),
    customer_name: document.getElementById('customerName').value.trim(),
    customer_phone: document.getElementById('customerPhone').value.trim(),
    payment_method: document.getElementById('paymentMethod').value,
    notes: document.getElementById('saleNotes').value.trim(),
  };
  const r = await apiPost('pos.php', payload, 'record');
  if (!r.success) { alert(r.message); return; }
  alert('Mauzo yamerekodiwa! Namba: ' + r.sale_code + ' — Jumla: ' + money(r.total));
  saleItems = [];
  document.getElementById('saleForm').reset();
  renderSaleItems();
  if (productAc) productAc.clear();
  await loadVariants();
  await loadRecent();
}

loadPage();
</script>
</body>
</html>
