<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umesahau Password? - FRESH SCENTS</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="icon" href="images/logo.jpeg">
<style>
 body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a1408,#2b2118);}
 .box{max-width:420px;width:92%;background:#fffdf8;border-radius:16px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
 .box h1{font-size:17px;color:#8a6d1f;text-align:center;margin-bottom:16px}
 .logo-wrap{text-align:center;margin-bottom:10px}
 .logo-wrap img{width:64px}
 .switch-link{text-align:center;margin-top:12px;font-size:12.5px}
</style>
</head>
<body>
<div class="box">
  <div class="logo-wrap"><img src="images/logo.jpeg" alt="Fresh Scents"></div>
  <h1>Kurejesha Password kwa Swali la Usalama</h1>
  <div id="alertBox"></div>

  <form id="findForm">
    <label>Username au Email Yako</label>
    <input type="text" name="identifier" required autofocus placeholder="Andika username yako">
    <button type="submit" class="btn-primary" style="width:100%;margin-top:14px">Endelea</button>
  </form>

  <form id="resetForm" class="hidden">
    <label>Swali la Usalama</label>
    <input type="text" id="questionDisplay" disabled>
    <label>Jibu Lako</label>
    <input type="text" name="security_answer" required>
    <label>Password Mpya</label>
    <div class="password-field">
      <input type="password" name="new_password" required>
      <button type="button" class="password-toggle-btn" onclick="togglePasswordField(this)" tabindex="-1"><i class="bi bi-eye"></i></button>
    </div>
    <label>Rudia Password Mpya</label>
    <div class="password-field">
      <input type="password" name="confirm_password" required>
      <button type="button" class="password-toggle-btn" onclick="togglePasswordField(this)" tabindex="-1"><i class="bi bi-eye"></i></button>
    </div>
    <button type="submit" class="btn-primary" style="width:100%;margin-top:14px">Badilisha Password</button>
  </form>

  <div id="doneBox" class="hidden" style="text-align:center">
    <a class="btn-primary" style="display:inline-block;text-decoration:none" href="login.html">Nenda Kuingia</a>
  </div>

  <div class="switch-link"><a href="login.html">&larr; Rudi Kuingia</a></div>
</div>

<script src="js/api.js"></script>
<script>
let identifier = '';

document.getElementById('findForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  identifier = e.target.identifier.value.trim();
  const r = await apiPost('forgot-password.php', { identifier }, 'find');
  const box = document.getElementById('alertBox');
  if (!r.success) {
    box.innerHTML = `<div class="alert alert-error">${r.message}</div>`;
    return;
  }
  box.innerHTML = '';
  document.getElementById('questionDisplay').value = r.security_question;
  document.getElementById('findForm').classList.add('hidden');
  document.getElementById('resetForm').classList.remove('hidden');
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const r = await apiPost('forgot-password.php', {
    identifier,
    security_answer: form.security_answer.value.trim(),
    new_password: form.new_password.value,
    confirm_password: form.confirm_password.value,
  }, 'reset');

  const box = document.getElementById('alertBox');
  box.innerHTML = `<div class="alert ${r.success ? 'alert-success' : 'alert-error'}">${r.message}</div>`;
  if (r.success) {
    document.getElementById('resetForm').classList.add('hidden');
    document.getElementById('doneBox').classList.remove('hidden');
  }
});
</script>
</body>
</html>
