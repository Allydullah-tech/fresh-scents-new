<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRESH SCENTS — Mfumo wa Ndani wa Duka</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="icon" href="images/logo.jpeg">
<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    background:
      linear-gradient(135deg, rgba(26,20,8,.90), rgba(43,33,24,.85)),
      url('images/logo.jpeg');
    background-size: cover;
    background-position: center 20%;
    color: #f2e9cf;
  }
  .hero-inner { max-width: 480px; padding: 40px 24px; }
  .hero-inner .logo-badge {
    width: 110px; margin: 0 auto 22px;
    filter: drop-shadow(0 6px 20px rgba(201,162,39,.5));
  }
  .hero-inner h1 { font-size: 30px; color: #fff; margin: 8px 0 4px; letter-spacing: .5px; }
  .hero-inner h1 span { color: var(--gold-light); }
  .hero-inner p.tagline { font-size: 14.5px; color: #e7dcb9; margin-bottom: 30px; }
  .hero-btns { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  .btn-hero {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 13px 26px; border-radius: 999px; border: none;
    font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none;
    transition: .2s;
  }
  .btn-hero.gold { background: linear-gradient(90deg, var(--gold-light), var(--gold)); color: #241b06; }
  .btn-hero.gold:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(201,162,39,.4); }
  .btn-hero.outline { background: transparent; border: 2px solid var(--gold-light); color: #f2e9cf; }
  .btn-hero.outline:hover { background: var(--gold-light); color: #241b06; }
  @media (max-width: 480px) { .hero-inner h1 { font-size: 24px; } }
</style>
</head>
<body>
  <div class="hero-inner">
    <img class="logo-badge" src="images/logo.jpeg" alt="Logo">
    <h1 id="shopNameHeading">Karibu <span>FRESH SCENTS</span></h1>
    <p class="tagline" id="taglineText">Mfumo wa Ndani wa Duka</p>
    <div class="hero-btns" id="actionButtons">
      <a href="login.html" class="btn-hero gold"><i class="bi bi-box-arrow-in-right"></i> Ingia Kwenye Mfumo</a>
    </div>
  </div>

<script src="js/api.js"></script>
<script>
async function loadLandingInfo() {
  const r = await apiGet('install.php', { action: 'status' });
  if (!r.success) return;

  if (r.shop_name) {
    document.getElementById('shopNameHeading').innerHTML = `Karibu <span>${r.shop_name}</span>`;
  }
  if (r.shop_tagline) {
    document.getElementById('taglineText').textContent = r.shop_tagline;
  }

  if (!r.installed) {
    document.getElementById('actionButtons').innerHTML = `
      <a href="install.html" class="btn-hero gold"><i class="bi bi-gear"></i> Sakinisha Mfumo</a>
    `;
  }
}
loadLandingInfo();
</script>
</body>
</html>
